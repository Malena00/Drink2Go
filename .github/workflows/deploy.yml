name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # Здесь укажите вашу основную ветку (main или master)
  workflow_dispatch: # Позволяет запускать деплой вручную

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Указываем путь к папке, которую нужно опубликовать
          path: './build'  # <-- ВАЖНО: здесь может быть './dist' или './out'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
